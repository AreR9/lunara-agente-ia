<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNARA+ | Login</title>
    <!-- esto conecta la vista con el archivo de estilos en la carpeta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <!-- esta capa mejora el contraste del fondo estatico -->
    <div class="capa"></div>

    <!-- esto centra toda la cajita del login en la pantalla -->
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">LUNARA</div>
            <p class="login-subtitle">Musica al alcance de la Luna</p>

            <!-- esto atrapa las alertas o errores que manda flask y los avienta en la pantalla -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <!-- esto le cambia la clase o el color al mensaje segun si es error o aviso -->
                    <div class="flash-msg flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <!-- esto conecta los datos que escribes directo con la funcion de login en el python -->
            <form method="POST" action="{{ url_for('login') }}" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <!-- esto gatilla el envio del formulario al servidor -->
                <button type="submit" class="btn-login">Iniciar sesion</button>
            </form>
        </div>
    </main>
</body>
</html>
